<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -14 180 72" width="180" height="72" role="presentation">
<style>
.flame{animation:flare .6s steps(2,jump-none) infinite alternate;transform-origin:0 28px}
@keyframes flare{from{transform:scaleX(1);opacity:.8}to{transform:scaleX(1.3);opacity:.45}}
@media (prefers-reduced-motion: reduce){.flame{animation:none}}
</style>
<g fill="#1f2a4a" stroke="#6FBF4B" stroke-width="1.4" stroke-linejoin="round"><rect x="8" y="12" width="104" height="32" rx="14"/><rect x="26" y="6" width="60" height="6" rx="3"/><rect x="26" y="44" width="60" height="6" rx="3"/><circle cx="98" cy="28" r="4" fill="#8FD0FF" stroke="none"/></g>
<path class="flame" d="M0 28 L-30 28" stroke="#6FBF4B" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
