@media (prefers-reduced-motion: reduce){.flame{animation:none}}
</style>
<g fill="#1f2a4a" stroke="#E8B23A" stroke-width="1.4" stroke-linejoin="round"><path d="M4 28 L24 10 L100 10 L120 28 L100 46 L24 46 Z"/><rect x="40" y="20" width="44" height="16" rx="3" fill="none"/><circle cx="106" cy="28" r="3.5" fill="#8FD0FF" stroke="none"/></g>
<path class="flame" d="M0 28 L-30 28" stroke="#E8B23A" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
